# Site map for Git Sync. GitBook reads this from the repository root
# unless a Project directory is set. The space content lives in ./documentation.
# Draft only: do not publish until the pages are reviewed.
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Capsule
  structure:
    - type: section
      key: capsule-docs
      title: Capsule
      path: docs
      default: true
      description: Open the $25 pack or the Garage Pack. Buy the card back, or Double a Common on the $25 pack.
      children:
        - type: space
          key: capsule
          title: Product
          path: product
          default: true
          content:
            directory: ./documentation
            language: en
