# Site map for Git Sync. GitBook reads this from the repository root
# unless a Project directory is set. The space content lives in ./documentation.
# Draft only: do not publish until the pages are reviewed.
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Capsule
  structure:
    - type: section
      key: capsule-docs
      title: Capsule
      path: docs
      children:
        - type: space
          key: capsule
          title: Product
          path: product
          default: true
          description: Open a graded pack, then buy the card back or fund it.
          content:
            directory: ./documentation
            language: en
