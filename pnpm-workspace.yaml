allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: set this to true or false
  keccak: true
  msgpackr-extract: set this to true or false
  prisma: true
  utf-8-validate: true
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - '@next/*'
  - next
